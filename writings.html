<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lily Holmes | J-Card </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-[var(--color-page)] text-[var(--color-text)] antialiased">
    <header class="border-b border-[var(--color-border)] bg-[var(--color-nav)]">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
        <a class="text-base font-semibold tracking-wide text-[var(--color-heading)]" href="index.html">Lily Holmes</a>
        <div class="flex items-center gap-5 text-sm font-medium text-[var(--color-text-muted)]">
          <a class="hover:text-[var(--color-link-hover)]" href="index.html">Home</a>
          <a class="hover:text-[var(--color-link-hover)]" href="projects.html">Projects</a>
          <a class="font-semibold text-[var(--color-heading)]" href="writings.html">Writings</a>
          <a class="hover:text-[var(--color-link-hover)]" href="contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="mx-auto max-w-6xl px-6 py-16">
        <p class="mb-4 text-sm font-semibold uppercase tracking-wider text-[var(--color-accent)]">Writings</p>
        <h1 class="hero-heading text-4xl font-bold leading-tight md:text-5xl">
          Reflections.
        </h1>
        <p class="mt-6 text-lg leading-8 text-[var(--color-text-muted)]">
          A space where I reflect on projects and learning. The goal is to develop and communicate an idea.    

          <br><em>All writing done by me, for better or worse.</em> 
        </p>
      </section>

      <section class="border-y border-[var(--color-border)] bg-[var(--color-surface)] py-12">
        <div id="writings-list" class="mx-auto max-w-6xl space-y-12 px-6"></div>
      </section>
    </main>

    <footer class="border-t border-[var(--color-border)] bg-[var(--color-surface)] px-6 py-8 text-[var(--color-text)]">
      <div class="mx-auto flex max-w-6xl flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <p class="archive-muted text-sm">Lily Holmes</p>
        <a class="archive-link text-sm font-semibold" href="index.html">Back to portfolio</a>
      </div>
    </footer>

    <script src="writings.js"></script>
  </body>
</html>
